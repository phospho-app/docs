components:
  schemas:
    AdminSettingsResponse:
      description: Contains the settings returned in the admin page
      properties:
        cameras_to_disable:
          anyOf:
            - items:
                type: integer
              type: array
            - type: "null"
          title: Cameras To Disable
        dataset_name:
          title: Dataset Name
          type: string
        episode_format:
          title: Episode Format
          type: string
        freq:
          title: Freq
          type: integer
        task_instruction:
          title: Task Instruction
          type: string
        video_codec:
          enum:
            - avc1
            - hev1
            - mp4v
            - hvc1
            - avc3
            - av01
            - vp09
          title: Video Codec
          type: string
        video_size:
          items:
            type: integer
          title: Video Size
          type: array
      required:
        - dataset_name
        - freq
        - episode_format
        - cameras_to_disable
        - video_codec
        - video_size
        - task_instruction
      title: AdminSettingsResponse
      type: object
    AllCamerasStatus:
      description:
        Description of the status of all cameras. Use this to know which
        camera to stream.
      properties:
        cameras_status:
          items:
            $ref: "#/components/schemas/SingleCameraStatus"
          title: Cameras Status
          type: array
        is_stereo_camera_available:
          default: false
          description: Whether a stereoscopic camera is available.
          title: Is Stereo Camera Available
          type: boolean
        realsense_available:
          default: false
          description: Whether a RealSense camera is available.
          title: Realsense Available
          type: boolean
        video_cameras_ids:
          description: List of camera ids that are video cameras.
          items:
            type: integer
          title: Video Cameras Ids
          type: array
      title: AllCamerasStatus
      type: object
    AppControlData:
      description: Type of data sent by the Metaquest app.
      properties:
        open:
          description: 0 for closed, 1 for open
          title: Open
          type: number
        rx:
          description: Absolute Pitch in degrees
          title: Rx
          type: number
        ry:
          description: Absolute Yaw in degrees
          title: Ry
          type: number
        rz:
          description: Absolute Roll in degrees
          title: Rz
          type: number
        source:
          default: right
          description: Which hand the data comes from. Can be left or right.
          enum:
            - left
            - right
          title: Source
          type: string
        timestamp:
          anyOf:
            - type: number
            - type: "null"
          description: Unix timestamp with milliseconds
          title: Timestamp
        x:
          title: X
          type: number
        y:
          title: Y
          type: number
        z:
          title: Z
          type: number
      required:
        - x
        - y
        - z
        - rx
        - ry
        - rz
        - open
      title: AppControlData
      type: object
    Body_sync_dataset_dataset_sync_post:
      properties:
        path:
          title: Path
          type: string
      required:
        - path
      title: Body_sync_dataset_dataset_sync_post
      type: object
    BrowseFilesResponse:
      description:
        Represents a response for browsing directories or items in a robotic
        system.
      properties:
        directoryTitle:
          title: Directorytitle
          type: string
        episode_ids:
          default: []
          items:
            type: integer
          title: Episode Ids
          type: array
        episode_paths:
          default: []
          items:
            type: string
          title: Episode Paths
          type: array
        items:
          items:
            $ref: "#/components/schemas/ItemInfo"
          title: Items
          type: array
        tokenError:
          anyOf:
            - type: string
            - type: "null"
          title: Tokenerror
      required:
        - directoryTitle
        - items
      title: BrowseFilesResponse
      type: object
    BrowserFilesRequest:
      description: Request to browse files in a directory.
      properties:
        path:
          title: Path
          type: string
      required:
        - path
      title: BrowserFilesRequest
      type: object
    CalibrateResponse:
      description: Response from the calibration endpoint.
      properties:
        calibration_status:
          description: Status of the calibration. Ends when status is success or error.
          enum:
            - error
            - success
            - in_progress
          title: Calibration Status
          type: string
        current_step:
          title: Current Step
          type: integer
        message:
          title: Message
          type: string
        total_nb_steps:
          title: Total Nb Steps
          type: integer
      required:
        - calibration_status
        - message
        - current_step
        - total_nb_steps
      title: CalibrateResponse
      type: object
    DeleteEpisodeRequest:
      description: Request to delete an episode.
      properties:
        episode_id:
          title: Episode Id
          type: integer
        path:
          title: Path
          type: string
      required:
        - path
        - episode_id
      title: DeleteEpisodeRequest
      type: object
    EndEffectorPosition:
      description: "End effector position for a movement in absolute frame.

        All zeros means the initial position, that you get by calling /move/init"
      properties:
        open:
          description: 0 for closed, 1 for open
          title: Open
          type: number
        rx:
          description: Absolute Pitch in degrees
          title: Rx
          type: number
        ry:
          description: Absolute Yaw in degrees
          title: Ry
          type: number
        rz:
          description: Absolute Roll in degrees
          title: Rz
          type: number
        x:
          description: X position in centimeters
          title: X
          type: number
        y:
          description: Y position in centimeters
          title: Y
          type: number
        z:
          description: Z position in centimeters
          title: Z
          type: number
      required:
        - x
        - y
        - z
        - rx
        - ry
        - rz
        - open
      title: EndEffectorPosition
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HuggingFaceTokenRequest:
      description: Hugging Face token saved by the user.
      properties:
        token:
          title: Token
          type: string
      required:
        - token
      title: HuggingFaceTokenRequest
      type: object
    ItemInfo:
      description:
        Contains the information of the items in a directory used in the
        browser page
      properties:
        absolute_path:
          title: Absolute Path
          type: string
        browseUrl:
          anyOf:
            - type: string
            - type: "null"
          title: Browseurl
        canDeleteDataset:
          default: false
          title: Candeletedataset
          type: boolean
        deleteDatasetAction:
          anyOf:
            - type: string
            - type: "null"
          title: Deletedatasetaction
        downloadUrl:
          anyOf:
            - type: string
            - type: "null"
          title: Downloadurl
        is_dir:
          title: Is Dir
          type: boolean
        name:
          title: Name
          type: string
        path:
          title: Path
          type: string
        previewUrl:
          anyOf:
            - type: string
            - type: "null"
          title: Previewurl
      required:
        - name
        - path
        - absolute_path
        - is_dir
      title: ItemInfo
      type: object
    JointsReadResponse:
      description: Response to read the joints of the robot.
      properties:
        angles_motor_units:
          description:
            A list of length 7, with the position of each joint in motor
            units.
          items:
            type: integer
          title: Angles Motor Units
          type: array
        angles_rad:
          description: A list of length 7, with the position of each joint in radian.
          items:
            type: number
          title: Angles Rad
          type: array
      required:
        - angles_rad
        - angles_motor_units
      title: JointsReadResponse
      type: object
    JointsWriteRequest:
      description: Request to set the joints of the robot.
      properties:
        angles:
          description: A list of length 7, with the position of each joint in radian.
          items:
            type: number
          title: Angles
          type: array
        unit:
          default: rad
          description: The unit of the angles. Defaults to radian.
          enum:
            - rad
            - motor_units
            - degrees
          title: Unit
          type: string
      required:
        - angles
      title: JointsWriteRequest
      type: object
    LeaderFollower:
      description: Request to set up leader-follower control between two SO100 robots
      properties:
        enable_gravity_compensation:
          default: false
          description: Disable gravity compensation for the leader robot
          title: Enable Gravity Compensation
          type: boolean
        gravity_compensation_values:
          anyOf:
            - additionalProperties:
                type: integer
              type: object
            - type: "null"
          default:
            elbow: 50
            shoulder: 100
            wrist: 10
          description:
            Gravity compensation pourcentage values for shoulder, elbow,
            and wrist joints (0-100%)
          title: Gravity Compensation Values
        invert_controls:
          default: false
          description: Mirror controls for the follower robot
          title: Invert Controls
          type: boolean
        robot_order:
          default:
            - 58FA0811789
            - 58FA0826529
          description: List of robot serial numbers in the order of leader, follower
          items:
            type: string
          title: Robot Order
          type: array
      title: LeaderFollower
      type: object
    MoveAbsoluteRequest:
      description:
        "Move the robot to an absolute position. All zeros means the initial
        position,

        that you get by calling /move/init."
      properties:
        max_trials:
          default: 10
          description: The maximum number of trials to reach the target position.
          minimum: 1.0
          title: Max Trials
          type: integer
        open:
          description: 0 for closed, 1 for open
          title: Open
          type: number
        orientation_tolerance:
          default: 0.2
          description:
            Increase max_trials and decrease tolerance to get more precision.Orientation
            tolerance is the euclidean distance between the target and the current
            orientation.
          minimum: 0.0
          title: Orientation Tolerance
          type: number
        position_tolerance:
          default: 0.03
          description:
            Increase max_trials and decrease tolerance to get more precision.Position
            tolerance is the euclidean distance between the target and the current
            position.
          minimum: 0.0
          title: Position Tolerance
          type: number
        rx:
          description: Absolute Pitch in degrees
          title: Rx
          type: number
        ry:
          description: Absolute Yaw in degrees
          title: Ry
          type: number
        rz:
          description: Absolute Roll in degrees
          title: Rz
          type: number
        x:
          description: X position in centimeters
          title: X
          type: number
        y:
          description: Y position in centimeters
          title: Y
          type: number
        z:
          description: Z position in centimeters
          title: Z
          type: number
      required:
        - x
        - y
        - z
        - rx
        - ry
        - rz
        - open
      title: MoveAbsoluteRequest
      type: object
    NetworkCredentials:
      properties:
        password:
          title: Password
          type: string
        ssid:
          title: Ssid
          type: string
      required:
        - ssid
        - password
      title: NetworkCredentials
      type: object
    RecordingPlayRequest:
      description: Request to play a recorded episode.
      properties:
        episode_path:
          anyOf:
            - type: string
            - type: "null"
          description: Path to the .json or .parquet file of the episode to play.
          examples:
            - ~/phosphobot/lerobot_v2/example_dataset/chunk-000/episode_000000.json
          title: Episode Path
      title: RecordingPlayRequest
      type: object
    RecordingStartRequest:
      description: Request to start the recording of an episode.
      properties:
        branch_path:
          anyOf:
            - type: string
            - type: "null"
          description:
            Path to the branch to push the dataset to, in addition to the
            main branch. If set to None, only push to the main branch. Defaults to
            None.
          title: Branch Path
        cameras_ids_to_record:
          anyOf:
            - items:
                type: integer
              type: array
            - type: "null"
          description:
            List of camera ids to record. If set to None, records all available
            cameras.
          examples:
            - - 0
              - 1
          title: Cameras Ids To Record
        dataset_name:
          anyOf:
            - type: string
            - type: "null"
          description:
            Name of the dataset to save the episode in.If None, defaults
            to the value set in Admin Configuration.
          examples:
            - example_dataset
          title: Dataset Name
        episode_format:
          anyOf:
            - enum:
                - json
                - lerobot_v2
              type: string
            - type: "null"
          description: "Format to save the episode.

            `json` is compatible with OpenVLA and stores videos as a series of npy.

            `lerobot_v2` is compatible with [lerobot training.](https://docs.phospho.ai/learn/ai-models).If
            None, defaults to the value set in Admin Configuration."
          examples:
            - lerobot_v2
          title: Episode Format
        freq:
          anyOf:
            - type: integer
            - type: "null"
          description:
            Records steps of the robot at this frequency.If None, defaults
            to the value set in Admin Configuration.
          examples:
            - 30
          title: Freq
        instruction:
          anyOf:
            - type: string
            - type: "null"
          description:
            A text describing the recorded task. If set to None, defaults
            to the value set in Admin Configuration.
          examples:
            - Pick up the orange brick and put it in the black box.
          title: Instruction
        robot_serials_to_ignore:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          description:
            List of robot indexes to ignore. If set to None, records all
            available robots.
          examples:
            - - 1
          title: Robot Serials To Ignore
        target_video_size:
          anyOf:
            - maxItems: 2
              minItems: 2
              prefixItems:
                - type: integer
                - type: integer
              type: array
            - type: "null"
          description:
            Target video size for the recording, all videos in the dataset
            should have the same size. If set to None, defaults to the value set in
            Admin Configuration.
          examples:
            - - 320
              - 240
          title: Target Video Size
        video_codec:
          anyOf:
            - enum:
                - avc1
                - hev1
                - mp4v
                - hvc1
                - avc3
                - av01
                - vp09
              type: string
            - type: "null"
          description:
            Codec to use for the video saving.If None, defaults to the
            value set in Admin Configuration.
          examples:
            - mp4v
          title: Video Codec
      title: RecordingStartRequest
      type: object
    RecordingStopRequest:
      description: Request to stop the recording of the episode.
      properties:
        recording_is_already_stopped:
          default: false
          description: Whether the recording is stopped. Default to False.
          title: Recording Is Already Stopped
          type: boolean
        save:
          default: true
          description: Whether to save the episode to disk. Defaults to True.
          title: Save
          type: boolean
      title: RecordingStopRequest
      type: object
    RecordingStopResponse:
      description:
        Response when the recording is stopped. The episode is saved in
        the given path.
      properties:
        episode_folder_path:
          anyOf:
            - type: string
            - type: "null"
          description: Path to the folder where the episode is saved.
          title: Episode Folder Path
        episode_index:
          anyOf:
            - type: integer
            - type: "null"
          description: Index of the recorded episode in the dataset.
          title: Episode Index
      required:
        - episode_folder_path
        - episode_index
      title: RecordingStopResponse
      type: object
    RelativeEndEffectorPosition:
      description:
        "Relative end effector position for a movement in relative frame.

        Useful for OpenVLA-like control."
      properties:
        open:
          title: Open
          type: number
        rx:
          description: Relative Pitch in degrees
          title: Rx
          type: number
        ry:
          description: Relative Yaw in degrees
          title: Ry
          type: number
        rz:
          description: Relative Roll in degrees
          title: Rz
          type: number
        x:
          description: Delta X position in centimeters
          title: X
          type: number
        y:
          description: Delta Y position in centimeters
          title: Y
          type: number
        z:
          description: Delta Z position in centimeters
          title: Z
          type: number
      required:
        - x
        - y
        - z
        - rx
        - ry
        - rz
        - open
      title: RelativeEndEffectorPosition
      type: object
    RobotConfig:
      description: Contains the configuration of a robot.
      properties:
        name:
          title: Name
          type: string
        usb_port:
          anyOf:
            - type: string
            - type: "null"
          title: Usb Port
      required:
        - name
        - usb_port
      title: RobotConfig
      type: object
    ServerStatus:
      description: Contains the status of the app
      properties:
        cameras:
          $ref: "#/components/schemas/AllCamerasStatus"
        is_recording:
          default: false
          description: Whether the server is currently recording an episode.
          title: Is Recording
          type: boolean
        name:
          title: Name
          type: string
        robot_status:
          items:
            $ref: "#/components/schemas/RobotConfig"
          title: Robot Status
          type: array
        robots:
          deprecated: true
          items:
            type: string
          title: Robots
          type: array
        server_ip:
          description: IP address of the server
          examples:
            - 192.168.1.X
          title: Server Ip
          type: string
        status:
          enum:
            - ok
            - error
          title: Status
          type: string
        version_id:
          default: 0.2.104
          description: Current version of the teleoperation server
          title: Version Id
          type: string
      required:
        - status
        - name
        - server_ip
      title: ServerStatus
      type: object
    SingleCameraStatus:
      properties:
        camera_id:
          title: Camera Id
          type: integer
        camera_type:
          description: "Type of camera.

            `classic`: Standard camera detected by OpenCV.

            `stereo`: Stereoscopic camera. It has two lenses: left eye and right eye
            to give a 3D effect. The left half of the image is the left eye, and the
            right half is the right eye.

            `realsense`: Intel RealSense camera. It use infrared sensors to provide
            depth information. It requires a special driver.

            `dummy`: Dummy camera. Used for testing.

            `dummy_stereo`: Dummy stereoscopic camera. Used for testing.

            `unknown`: Unknown camera type."
          enum:
            - classic
            - stereo
            - realsense
            - dummy
            - dummy_stereo
            - unknown
          title: Camera Type
          type: string
        fps:
          title: Fps
          type: integer
        height:
          title: Height
          type: integer
        is_active:
          title: Is Active
          type: boolean
        width:
          title: Width
          type: integer
      required:
        - camera_id
        - is_active
        - camera_type
        - width
        - height
        - fps
      title: SingleCameraStatus
      type: object
    StatusResponse:
      additionalProperties: true
      description: Default response. May contain other fields.
      properties:
        message:
          anyOf:
            - type: string
            - type: "null"
          title: Message
        status:
          const: ok
          default: ok
          title: Status
          type: string
      title: StatusResponse
      type: object
    TorqueReadResponse:
      description: Response to read the torque of the robot.
      properties:
        current_torque:
          description: A list of length 7, with the current torque of each joint.
          items:
            type: number
          title: Current Torque
          type: array
      required:
        - current_torque
      title: TorqueReadResponse
      type: object
    UserSettingsRequest:
      description: Contains the user settings
      properties:
        cameras_to_disable:
          anyOf:
            - items:
                type: integer
              type: array
            - type: "null"
          title: Cameras To Disable
        dataset_name:
          title: Dataset Name
          type: string
        episode_format:
          title: Episode Format
          type: string
        freq:
          title: Freq
          type: integer
        task_instruction:
          title: Task Instruction
          type: string
        video_codec:
          enum:
            - avc1
            - hev1
            - mp4v
            - hvc1
            - avc3
            - av01
            - vp09
          title: Video Codec
          type: string
        video_size:
          items:
            type: integer
          title: Video Size
          type: array
      required:
        - dataset_name
        - episode_format
        - freq
        - video_codec
        - video_size
        - task_instruction
      title: UserSettingsRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
        - loc
        - msg
        - type
      title: ValidationError
      type: object
    VizSettingsResponse:
      description: Settings for the vizualisation page.
      properties:
        height:
          title: Height
          type: integer
        quality:
          title: Quality
          type: integer
        width:
          title: Width
          type: integer
      required:
        - width
        - height
        - quality
      title: VizSettingsResponse
      type: object
    VoltageReadResponse:
      description: Response to read the torque of the robot.
      properties:
        current_voltage:
          description: A list of length 7, with the current voltage of each joint.
          items:
            type: number
          title: Current Voltage
          type: array
      required:
        - current_voltage
      title: VoltageReadResponse
      type: object
info:
  title: FastAPI
  version: 0.1.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: serve_dashboard__get
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Serve Dashboard
      tags:
        - pages
  /admin:
    get:
      operationId: serve_dashboard_admin_get
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Serve Dashboard
      tags:
        - pages
  /admin/form/usersettings:
    post:
      operationId: submit_user_settings_admin_form_usersettings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Submit User Settings
      tags:
        - pages
  /admin/huggingface:
    post:
      operationId: submit_token_admin_huggingface_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/HuggingFaceTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Submit Token
      tags:
        - pages
  /admin/settings:
    get:
      operationId: get_admin_settings_admin_settings_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsResponse"
          description: Successful Response
      summary: Get Admin Configuration
      tags:
        - pages
  /browse:
    get:
      operationId: serve_dashboard_browse_get
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Serve Dashboard
      tags:
        - pages
  /calibrate:
    post:
      description: Start the calibration sequence for the robot.
      operationId: calibrate_calibrate_post
      parameters:
        - in: query
          name: robot_id
          required: false
          schema:
            default: 0
            title: Robot Id
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrateResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Calibrate Robot
      tags:
        - control
  /calibration:
    get:
      operationId: serve_dashboard_calibration_get
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Serve Dashboard
      tags:
        - pages
  /control:
    get:
      operationId: serve_dashboard_control_get
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Serve Dashboard
      tags:
        - pages
  /crane:
    get:
